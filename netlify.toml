# Deploy en Netlify. El runtime de Next.js (OpenNext) se detecta e instala solo:
# no hace falta agregar plugins ni variables de entorno.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Las cabeceras de seguridad y el noindex están en next.config.ts.

# Video y fotos sin hash en el nombre: una semana de caché.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
